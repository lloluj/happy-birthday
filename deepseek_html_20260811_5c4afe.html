<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С днём рождения, Кристи! ❤️</title>
    <!-- Подключаем шрифт для элегантности -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #fce4ec 0%, #f8bbd0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Карточка-поздравление */
        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 48px 40px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15), 0 10px 25px rgba(183, 28, 28, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        /* Имя с особым оформлением */
        .name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.5rem, 15vw, 5.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, #880e4f, #d81b60, #ad1457);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(216, 27, 96, 0.2);
            position: relative;
            display: inline-block;
        }

        .name::after {
            content: "✨";
            font-size: 2.2rem;
            position: absolute;
            right: -50px;
            top: -10px;
            opacity: 0.8;
            animation: sparkle 2s infinite alternate;
        }

        .name::before {
            content: "💖";
            font-size: 2rem;
            position: absolute;
            left: -50px;
            top: 0px;
            opacity: 0.7;
            animation: sparkle 2.4s infinite alternate-reverse;
        }

        @keyframes sparkle {
            0% { transform: scale(0.8) rotate(-5deg); opacity: 0.5; }
            100% { transform: scale(1.2) rotate(8deg); opacity: 1; }
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            color: #4a2c3a;
            letter-spacing: 3px;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.3);
            display: inline-block;
            padding: 6px 24px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #3e2a34;
            margin: 28px 0 20px;
            padding: 0 8px;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 32px;
            padding: 24px 20px;
            border-left: 4px solid #d81b60;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .message i {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #880e4f;
        }

        .flower-line {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 2rem;
            margin: 16px 0 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #d81b60, #ad1457);
            color: white;
            font-weight: 600;
            padding: 16px 40px;
            border-radius: 60px;
            border: none;
            font-size: 1.1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 6px 20px rgba(216, 27, 96, 0.35);
            margin-top: 18px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.5);
            background: linear-gradient(135deg, #ad1457, #880e4f);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Плавающие сердечки (интерактив) */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.3;
            animation: floatHeart linear infinite;
            user-select: none;
            filter: drop-shadow(0 4px 10px rgba(216, 27, 96, 0.2));
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(110vh) rotate(0deg) scale(0.6);
                opacity: 0.1;
            }
            20% { opacity: 0.5; }
            80% { opacity: 0.6; }
            100% {
                transform: translateY(-20vh) rotate(720deg) scale(1.1);
                opacity: 0;
            }
        }

        /* Адаптивность */
        @media (max-width: 550px) {
            .card {
                padding: 32px 20px;
                border-radius: 32px;
            }
            .name::before,
            .name::after {
                display: none;
            }
            .message {
                font-size: 1rem;
                padding: 18px 14px;
            }
            .btn {
                padding: 14px 28px;
                font-size: 1rem;
                width: 100%;
            }
            .flower-line {
                font-size: 1.6rem;
                gap: 8px;
            }
        }

        /* Маленькая подпись */
        .footer-note {
            margin-top: 28px;
            font-size: 0.85rem;
            color: #6a4c5a;
            letter-spacing: 1px;
            opacity: 0.7;
            font-weight: 300;
        }

        /* Дополнительная анимация для сердечек при клике */
        .burst {
            animation: burst 0.6s ease-out forwards;
        }

        @keyframes burst {
            0% { transform: scale(0.2); opacity: 0; }
            50% { opacity: 1; transform: scale(1.8); }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Стиль для счётчика кликов (нежный) */
        .click-counter {
            font-size: 0.8rem;
            margin-top: 12px;
            color: #7a5a6a;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>
    <!-- Контейнер для фоновых сердечек -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Основная карточка -->
    <div class="card" id="card">
        <div class="subtitle">🎂 Сегодня твой день</div>
        <div class="name">Кристи</div>
        <div class="flower-line">
            <span>🌸</span> <span>🌺</span> <span>🌷</span> <span>🌹</span> <span>🌻</span>
        </div>
        <div class="message">
            <i>«Ты — свет, который делает мир ярче. </i><br>
            С каждым твоим днём все вокруг становится добрее и красивее. <br>
            Пусть улыбка не покидает твоё лицо, а сердце поёт от счастья!» <br>
            <span style="display: block; margin-top: 12px; font-weight: 300;">✨ С любовью и восхищением ✨</span>
        </div>

        <!-- Кнопка с интерактивом -->
        <button class="btn" id="surpriseBtn">💕 Подари улыбку 💕</button>
        <div class="click-counter" id="clickCounter">❤️ 0</div>
        <div class="footer-note">для самой прекрасной Кристи</div>
    </div>

    <script>
        (function() {
            // ====== Генерация фоновых сердец ======
            const heartsContainer = document.getElementById('heartsContainer');
            const heartSymbols = ['❤️', '💖', '💗', '💘', '💝', '✨', '🌸', '🌺'];

            function createHeart() {
                const heart = document.createElement('span');
                heart.classList.add('heart');
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                
                // Случайные размеры (от 1.2rem до 3rem)
                const size = 1.2 + Math.random() * 2.2;
                heart.style.fontSize = size + 'rem';
                
                // Случайная позиция по горизонтали
                heart.style.left = Math.random() * 100 + '%';
                
                // Случайная длительность анимации (от 12 до 26 секунд)
                const duration = 14 + Math.random() * 16;
                heart.style.animationDuration = duration + 's';
                
                // Случайная задержка
                heart.style.animationDelay = Math.random() * 10 + 's';
                
                // Немного меняем прозрачность
                heart.style.opacity = 0.2 + Math.random() * 0.3;
                
                heartsContainer.appendChild(heart);
                
                // Удаляем сердечко после завершения анимации (чтобы не засорять DOM)
                setTimeout(() => {
                    if (heart.parentNode) {
                        heart.remove();
                    }
                }, (duration + 5) * 1000);
            }

            // Создаём начальные сердечки
            for (let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 200);
            }

            // Периодически добавляем новые сердца
            setInterval(createHeart, 1800);

            // ====== Интерактивность: кнопка и счётчик ======
            const surpriseBtn = document.getElementById('surpriseBtn');
            const clickCounter = document.getElementById('clickCounter');
            let clickCount = 0;
            
            // Функция для создания "взрыва" сердечек при клике
            function burstHearts(x, y) {
                const count = 14;
                for (let i = 0; i < count; i++) {
                    const heart = document.createElement('span');
                    heart.textContent = ['❤️', '💖', '💗', '💘', '💝', '✨', '🌸'][Math.floor(Math.random() * 7)];
                    heart.style.position = 'fixed';
                    heart.style.left = x + 'px';
                    heart.style.top = y + 'px';
                    heart.style.fontSize = (1.2 + Math.random() * 2.2) + 'rem';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '999';
                    heart.style.transition = 'all 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2)';
                    heart.style.opacity = '1';
                    
                    // Случайное направление
                    const angle = Math.random() * 2 * Math.PI;
                    const distance = 80 + Math.random() * 180;
                    const dx = Math.cos(angle) * distance;
                    const dy = Math.sin(angle) * distance - 60;
                    
                    document.body.appendChild(heart);
                    
                    // Запускаем анимацию через микротик
                    requestAnimationFrame(() => {
                        heart.style.transform = `translate(${dx}px, ${dy}px) scale(0.4) rotate(${Math.random() * 360}deg)`;
                        heart.style.opacity = '0';
                    });
                    
                    // Удаляем элемент после анимации
                    setTimeout(() => {
                        if (heart.parentNode) {
                            heart.remove();
                        }
                    }, 800);
                }
            }

            // Обработчик клика по кнопке
            surpriseBtn.addEventListener('click', function(e) {
                // Увеличиваем счётчик
                clickCount++;
                clickCounter.textContent = '❤️ ' + clickCount;
                
                // Меняем текст кнопки периодически
                const phrases = ['💕 Ещё улыбку!', '✨ Ты прекрасна!', '🌹 С днём рождения!', '💖 Обнимаю!', '🌸 Ты — чудо!'];
                const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
                surpriseBtn.textContent = randomPhrase;
                
                // Взрыв сердец в месте клика (или по центру карточки)
                const rect = this.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                burstHearts(cx, cy);
                
                // Дополнительно: лёгкая анимация карточки
                const card = document.getElementById('card');
                card.style.transition = 'transform 0.15s ease';
                card.style.transform = 'scale(0.97)';
                setTimeout(() => {
                    card.style.transform = 'scale(1)';
                }, 150);
                
                // Добавляем пару плавающих сердечек в контейнер (для атмосферы)
                for (let i = 0; i < 3; i++) {
                    setTimeout(createHeart, i * 100);
                }
            });

            // Также можно кликать по карточке для дополнительного эффекта (но необязательно)
            document.getElementById('card').addEventListener('click', function(e) {
                // Но только если клик не по кнопке (чтобы не дублировать)
                if (e.target === surpriseBtn) return;
                // Создаём пару сердец в месте клика
                const rect = this.getBoundingClientRect();
                const x = e.clientX || rect.left + rect.width / 2;
                const y = e.clientY || rect.top + rect.height / 2;
                // Небольшой взрыв, но поменьше
                for (let i = 0; i < 5; i++) {
                    const heart = document.createElement('span');
                    heart.textContent = ['💖', '💗', '✨', '🌸'][Math.floor(Math.random() * 4)];
                    heart.style.position = 'fixed';
                    heart.style.left = (x + (Math.random() - 0.5) * 40) + 'px';
                    heart.style.top = (y + (Math.random() - 0.5) * 40) + 'px';
                    heart.style.fontSize = (1 + Math.random() * 1.6) + 'rem';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '999';
                    heart.style.transition = 'all 0.6s ease-out';
                    heart.style.opacity = '1';
                    document.body.appendChild(heart);
                    
                    const dx = (Math.random() - 0.5) * 120;
                    const dy = (Math.random() - 0.5) * 120 - 40;
                    requestAnimationFrame(() => {
                        heart.style.transform = `translate(${dx}px, ${dy}px) scale(0.3) rotate(${Math.random() * 200}deg)`;
                        heart.style.opacity = '0';
                    });
                    
                    setTimeout(() => {
                        if (heart.parentNode) heart.remove();
                    }, 700);
                }
            });

        })();
    </script>
</body>
</html>
